name: Pruebas

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  pruebas:
    name: Extracción, firma de autor y versión portable
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Go para el lanzador portable
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Instalar dependencias de prueba
        run: npm ci

      - name: Instalar Chromium para las pruebas en navegador
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas (incluye la integridad de la firma by Chiguin)
        run: npm test

      - name: Construir Yodo131.exe portable para Windows
        run: npm run portable

      - name: Guardar el paquete portable
        uses: actions/upload-artifact@v4
        with:
          name: Yodo131_Portable
          path: |
            portable/salida/Yodo131_Portable.zip
            portable/salida/SHA256.txt
          retention-days: 30
